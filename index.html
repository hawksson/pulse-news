<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Første GitHub Hjemmeside</title>
    <style>
        /* Grundlæggende design for siden */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Kortet i midten */
        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h1 {
            color: #24292e; /* GitHub mørkegrå */
            margin-bottom: 10px;
        }

        p {
            font-size: 1.1em;
            color: #586069;
            line-height: 1.6;
        }

        .success-badge {
            background-color: #2ea44f; /* GitHub grøn */
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            display: inline-block;
            font-weight: bold;
            margin-bottom: 20px;
        }

        footer {
            margin-top: 30px;
            font-size: 0.85em;
            color: #a3aab1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="success-badge">✓ Siden er live!</div>
        <h1>Succes!</h1>
        <p>Min første hjemmeside er nu lagt op og kører direkte via <strong>GitHub Pages</strong>.</p>
        <p>Nu kan jeg gå i gang med at ændre i koden og bygge min helt egen portfolio eller blog.</p>
        
        <footer>
            Skabt med HTML & CSS
        </footer>
    </div>

</body>
</html>
